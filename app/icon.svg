<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Salsa</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF3"/>
      <stop offset="0.55" stop-color="#EDE6D8"/>
      <stop offset="1" stop-color="#C9DCE8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.14" r="0.6">
      <stop offset="0" stop-color="#A9C6DA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A9C6DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A4B36"/>
      <stop offset="0.5" stop-color="#3C2A1E"/>
      <stop offset="1" stop-color="#1E140E"/>
    </linearGradient>
    <linearGradient id="sky" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#E4EFF6"/>
      <stop offset="0.42" stop-color="#A9C6DA"/>
      <stop offset="1" stop-color="#5E8CAC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#2F5F82" stop-opacity="0"/>
      <stop offset="1" stop-color="#2F5F82" stop-opacity="0.38"/>
    </linearGradient>
    <mask id="ast" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="218" y="80" width="76" height="352" rx="38" fill="#fff"/>
      <rect x="218" y="80" width="76" height="352" rx="38" fill="#fff" transform="rotate(60 256 256)"/>
      <rect x="218" y="80" width="76" height="352" rx="38" fill="#fff" transform="rotate(120 256 256)"/>
    </mask>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
  <rect width="512" height="512" rx="118" fill="url(#glow)"/>

  <!-- soft ground shadow -->
  <g transform="translate(0 26)" filter="url(#blur)" opacity="0.30">
    <rect width="512" height="512" fill="#1E140E" mask="url(#ast)"/>
  </g>
  <!-- espresso extrusion (depth) -->
  <g transform="translate(0 15)">
    <rect width="512" height="512" fill="url(#rim)" mask="url(#ast)"/>
  </g>
  <!-- top bevel light -->
  <g transform="translate(0 -4)">
    <rect width="512" height="512" fill="#FFFFFF" mask="url(#ast)" opacity="0.95"/>
  </g>
  <!-- front sky body -->
  <rect width="512" height="512" fill="url(#sky)" mask="url(#ast)"/>
  <rect width="512" height="512" fill="url(#shade)" mask="url(#ast)"/>
  <rect width="512" height="512" fill="url(#shine)" mask="url(#ast)" opacity="0.9"/>

  <!-- tile edge light -->
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="118" fill="none" stroke="#1E140E" stroke-opacity="0.10"/>
</svg>